 <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e131b">
<title>Página não encontrada — Projeto Antαres</title>
<link rel="icon" type="image/png" href="./img/icons/antares-192.png">
<script src="/js/init.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--bg);
    }

    main {
      width: min(100%, 520px);
      text-align: center;
      padding: 40px 24px;
    }

    .codigo {
      margin: 0;
      color: var(--acc);
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 800;
      line-height: 1;
    }

    h1 { margin: 20px 0 8px; }

    p { color: var(--ink); }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 8px;
      color: var(--acc);
      background: var(--card);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover { background: var(--acc); color: var(--card)}
    a:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo">404</p>
    <h1>Esta página está fora da órbita!</h1>
    <p>
      O endereço acessado não corresponde a uma página disponível.
      Talvez ela tenha mudado de lugar ou o endereço esteja incorreto.
    </p>
    <a href="./">Voltar ao Projeto Antαres</a>
  </main>
</body>
</html>
