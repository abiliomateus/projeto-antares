<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movimento de projéteis</title>
<link rel="icon" type="image/png" href="../img/icons/antares-192.png">
<script src="js/init.js"></script>
<script src="/js/header.js"></script>
</head>
<body>
<header id="site-header"></header>
<div class="wrap">
<div class="button"><a class="chip" href="index.html">← Voltar</a></div>
<header>
    <h2>Movimento de projéteis</h2>
    <p>Ajuste os parâmetros, lance e compare a trajetória simulada (linha cheia) com a ideal (tracejada).</p>
</header>

<!-- Ids que o JS espera encontrar: cv (canvas), ro (leituras), cmp (nota de comparação), bl/bp/bc (botões),
     ctl (sliders), pl (corpo celeste), cv_v/cv_a/cv_i/cv_t (caixas de seleção), p1/p2/p3 (gráficos).
     Cada <canvas> fica dentro de um <div> SEM padding: é a largura desse div que define o tamanho do canvas. -->
<main>
<section class="card"><div id="cv0" style="position: relative"><canvas id="cv"></canvas></div><div class="ro" id="ro"></div><p class="note" id="cmp"></p></section>
<aside class="card">
<div class="btns"><button class="p" id="bl">Lançar</button><button id="bp">Pausar</button><button id="bc">Limpar</button></div>
<div id="ctl"></div>
<strong>Opções</strong><br>

<label for="pl" style="font-size:.92rem">Corpo celeste</label>
<!-- Corpos celestes: value = g em m/s². Para incluir outro, adicione uma <option>. -->
<select id="pl"><option value="9.8">Terra (9,8 m/s²)</option><option value="1.62">Lua (1,62 m/s²)</option><option value="3.71">Marte (3,71 m/s²)</option><option value="24.8">Júpiter (24,8 m/s²)</option></select>
<label class="chk"><input type="checkbox" id="cv_v" checked><span class="sw" style="border-color:var(--acc)"></span>Velocidade e componentes</label>
<label class="chk"><input type="checkbox" id="cv_a"><span class="sw" style="border-color:var(--a)"></span>Aceleração</label>
<label class="chk"><input type="checkbox" id="cv_i" checked><span class="sw" style="border-top-style:dashed;border-color:var(--ghost)"></span>Parábola ideal (sem arrasto)</label>
<label class="chk"><input type="checkbox" id="cv_t" checked><span class="sw" style="border-color:var(--acc)"></span>Rastro</label>
</aside>
</main>
<!-- Gráficos: um card por canvas; o número de colunas é definido em core.css (.plots) -->
<section class="plots">
<div class="card"><div><canvas id="p1"></canvas></div></div>
<div class="card"><div><canvas id="p2"></canvas></div></div>
<div class="card"><div><canvas id="p3"></canvas></div></div>
</section>
</div>
<!-- Ordem importa: o núcleo primeiro, depois a simulação -->

<footer></footer>

<script src="/js/core.js"></script>
<script src="js/projeteis.js"></script>

</body>
</html>
